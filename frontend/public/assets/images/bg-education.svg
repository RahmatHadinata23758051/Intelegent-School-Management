<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="150" r="120" fill="#06b6d4" opacity="0.05"/>
  <circle cx="1100" cy="650" r="150" fill="#3b82f6" opacity="0.08"/>
  <circle cx="600" cy="400" r="100" fill="#06b6d4" opacity="0.03"/>
  
  <!-- Educational icons scattered -->
  
  <!-- Books -->
  <g transform="translate(150, 200)" opacity="0.15">
    <rect width="40" height="60" rx="2" fill="#06b6d4"/>
    <line x1="20" y1="0" x2="20" y2="60" stroke="#1e293b" stroke-width="2"/>
    <circle cx="20" cy="30" r="3" fill="#1e293b"/>
  </g>
  
  <!-- Graph/Analytics -->
  <g transform="translate(1050, 250)" opacity="0.12">
    <rect x="0" y="50" width="10" height="50" fill="#06b6d4"/>
    <rect x="15" y="30" width="10" height="70" fill="#0891b2"/>
    <rect x="30" y="10" width="10" height="90" fill="#06b6d4"/>
    <rect x="45" y="40" width="10" height="60" fill="#0891b2"/>
  </g>
  
  <!-- Graduation cap -->
  <g transform="translate(200, 600)" opacity="0.1">
    <polygon points="0,20 30,0 60,20" fill="#06b6d4"/>
    <rect x="20" y="20" width="20" height="40" fill="#3b82f6"/>
    <line x1="30" y1="60" x2="80" y2="80" stroke="#06b6d4" stroke-width="2"/>
  </g>
  
  <!-- Target/Goal -->
  <g transform="translate(1000, 500)" opacity="0.1">
    <circle cx="30" cy="30" r="30" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="10" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="30" cy="30" r="3" fill="#06b6d4"/>
  </g>
  
  <!-- Computer/Tech -->
  <g transform="translate(100, 50)" opacity="0.12">
    <rect x="0" y="0" width="50" height="35" rx="2" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <rect x="15" y="35" width="20" height="15" fill="#06b6d4"/>
    <circle cx="12" cy="17.5" r="2" fill="#06b6d4"/>
  </g>
  
  <!-- Light rays for tech feel -->
  <line x1="0" y1="0" x2="100" y2="100" stroke="#06b6d4" stroke-width="0.5" opacity="0.05"/>
  <line x1="1200" y1="0" x2="1100" y2="100" stroke="#3b82f6" stroke-width="0.5" opacity="0.05"/>
  <line x1="0" y1="800" x2="100" y2="700" stroke="#06b6d4" stroke-width="0.5" opacity="0.05"/>
</svg>